# Starter GitHub Actions CI workflow for static websites and documentation repositories.
# Copy to `.github/workflows/ci.yml` in static sites, docs workspaces, or early-stage repos.
name: Static Site and Docs CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs, config files, links, and static build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Validate JSON, YAML, Markdown links, and secret safety
        run: |
          python3 - << 'PY'
          import json, re, sys
          from pathlib import Path
          import yaml

          root = Path(".")
          ignore_dirs = {".git", "node_modules", "dist", "build", ".venv", "__pycache__"}
          errors = []

          def ignored(p: Path) -> bool:
              return any(part in ignore_dirs for part in p.parts)

          json_count = 0
          for jf in root.rglob("*.json"):
              if ignored(jf):
                  continue
              json_count += 1
              try:
                  json.loads(jf.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"Invalid JSON in {jf}: {exc}")

          yaml_count = 0
          for yf in list(root.rglob("*.yml")) + list(root.rglob("*.yaml")):
              if ignored(yf):
                  continue
              yaml_count += 1
              try:
                  parsed = yaml.safe_load(yf.read_text(encoding="utf-8"))
                  if parsed is None:
                      errors.append(f"Empty YAML file: {yf}")
              except Exception as exc:
                  errors.append(f"Invalid YAML in {yf}: {exc}")

          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          link_count = 0
          for md in root.rglob("*.md"):
              if ignored(md):
                  continue
              text = re.sub(r"```.*?```", "", md.read_text(encoding="utf-8"), flags=re.DOTALL)
              for m in link_re.finditer(text):
                  target = m.group(1).strip()
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  rel = target.split("#", 1)[0]
                  if not rel:
                      continue
                  link_count += 1
                  if not (md.parent / rel).resolve().exists():
                      errors.append(f"Broken relative link in {md}: {target}")

          secret_pats = [
              re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}"),
              re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"sk-[A-Za-z0-9]{20,}"),
              re.compile(r"AKIA[0-9A-Z]{16}"),
              re.compile(r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          ]
          for path in root.rglob("*"):
              if ignored(path) or path.is_dir() or path.as_posix().endswith(".github/workflows/ci.yml"):
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for pat in secret_pats:
                  if pat.search(content):
                      errors.append(f"Possible secret pattern detected in {path}")

          if errors:
              print("STATIC/DOCS VALIDATION FAILED:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)

          print(f"STATIC/DOCS VALIDATION PASSED: {json_count} JSON, {yaml_count} YAML, {link_count} Markdown links, 0 secret matches.")
          PY

      - name: Set up Node.js (if package.json exists)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static site (if package.json defines build)
        if: hashFiles('package.json') != ''
        run: |
          if node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts.build ? 0 : 1)'; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build
          else
            echo "No static build script in package.json; skipping."
          fi
